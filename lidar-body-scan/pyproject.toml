[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bodyscan"
version = "1.3.0"
description = "Ouster LiDAR capture, fusion and meshing of people, standing and moving, for radio ray tracing (Sionna RT)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Giuseppe D'Auria" }]
dependencies = ["numpy>=1.24", "open3d>=0.17"]

[project.optional-dependencies]
plots = ["matplotlib"]
capture = ["ouster-sdk>=0.11", "pyserial"]
motion = ["torch>=2.0", "pillow"]

[project.scripts]
bodyscan = "bodyscan.commands:main"

[tool.setuptools.packages.find]
include = ["bodyscan*"]
